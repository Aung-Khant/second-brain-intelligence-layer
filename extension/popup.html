<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Save to Brain</title>
  </head>
  <body>
    <main class="popup">
      <section id="video" class="video" hidden>
        <p id="video-title" class="video__title"></p>
        <p id="video-creator" class="video__creator"></p>
        <p id="video-summary" class="video__summary" hidden></p>
      </section>

      <p id="status" class="status" hidden></p>

      <section id="results" class="results" hidden>
        <div class="group" data-kind="areas">
          <div class="group__head">
            <h2 class="group__heading">Area</h2>
            <button class="group__add" data-reveal="areas" type="button">Add</button>
          </div>
          <ul class="group__list" data-list="areas"></ul>
          <div class="picker" data-picker="areas" hidden>
            <input
              class="picker__input"
              data-input="areas"
              placeholder="Search Areas"
              autocomplete="off"
            />
            <ul class="picker__list" data-options="areas"></ul>
          </div>
        </div>

        <div class="group" data-kind="projects">
          <div class="group__head">
            <h2 class="group__heading">Project</h2>
            <button class="group__add" data-reveal="projects" type="button">Add</button>
          </div>
          <ul class="group__list" data-list="projects"></ul>
          <div class="picker" data-picker="projects" hidden>
            <input
              class="picker__input"
              data-input="projects"
              placeholder="Search Projects"
              autocomplete="off"
            />
            <ul class="picker__list" data-options="projects"></ul>
          </div>
        </div>

        <div class="group" data-kind="topics">
          <div class="group__head">
            <h2 class="group__heading">Topics</h2>
            <button class="group__add" data-reveal="topics" type="button">Add</button>
          </div>
          <ul class="group__list" data-list="topics"></ul>
          <div class="picker" data-picker="topics" hidden>
            <input
              class="picker__input"
              data-input="topics"
              placeholder="Search Topics"
              autocomplete="off"
            />
            <ul class="picker__list" data-options="topics"></ul>
          </div>
        </div>

        <div class="why">
          <label class="why__label" for="why-saved">
            Why saved? <span class="why__required">required</span>
          </label>
          <textarea
            id="why-saved"
            class="why__input"
            rows="2"
            placeholder="Why saved?"
          ></textarea>
        </div>
      </section>

      <footer class="footer">
        <button id="save" class="button" type="button" disabled>Save to Brain</button>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
